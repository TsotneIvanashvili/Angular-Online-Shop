@if (isShown) {
  <div class="gate" (click)="outSide($event)" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate__card glass">
      <button class="gate__close" (click)="closeErr()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="gate__icon" aria-hidden="true">
        <i class="fa-solid fa-lock"></i>
      </div>

      <h2 id="gate-title">Sign in to add this</h2>
      <p class="gate__text">
        Your cart is tied to your account, so it follows you between devices.
        It only takes a moment.
      </p>

      <div class="gate__actions">
        <a class="btn btn-primary" routerLink="/Signin" (click)="closeErr()">Sign in</a>
        <a class="btn btn-secondary" routerLink="/register" (click)="closeErr()">Create an account</a>
      </div>
    </div>
  </div>
}
